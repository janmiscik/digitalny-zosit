<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Upraviť {{ customer.name }} - Digitálny zošit
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <div class="logo">
        📒 Digitálny zošit
    </div>


    <div class="topbar-actions">

        <button
            type="button"
            class="theme-button"
            id="themeButton"
            onclick="toggleTheme()"
            title="Prepnúť tému"
        >
            🌙
        </button>


        <a
            href="/customers/{{ customer.id }}"
            class="back-button"
        >
            ← Späť
        </a>

    </div>

</header>


<main class="container">


    <section class="edit-customer-page">


        <div class="page-header">

            <h1>
                Upraviť zákazníka
            </h1>

            <p>
                Zmeňte údaje zákazníka.
            </p>

        </div>


        <div class="edit-customer-card">


            <form
                action="/customers/{{ customer.id }}/edit"
                method="post"
            >


                <label>
                    Meno *
                </label>


                <input
                    type="text"
                    id="edit-customer-name"
                    name="name"
                    value="{{ customer.name }}"
                    required
                >


                <label>
                    Telefón
                </label>


                <input
                    type="text"
                    name="phone"
                    value="{{ customer.phone or '' }}"
                >


                <label>
                    Email
                </label>


                <input
                    type="email"
                    name="email"
                    value="{{ customer.email or '' }}"
                >


                <label>
                    Adresa
                </label>


                <input
                    type="text"
                    id="edit-customer-address"
                    name="address"
                    value="{{ customer.address or '' }}"
                >


                <label>
                    IČO <span style="font-weight: 400; color: var(--text-muted);">(pre firmy/živnostníkov)</span>
                </label>

                <div style="display: flex; gap: 8px;">

                    <input
                        type="text"
                        id="edit-customer-ico"
                        name="ico"
                        value="{{ customer.ico or '' }}"
                        style="flex: 1;"
                    >

                    <button
                        type="button"
                        class="cancel-button"
                        onclick="lookupCustomerIco('edit')"
                    >
                        Nájsť
                    </button>

                </div>

                <p
                    id="edit-customer-ico-status"
                    style="font-size: 0.85em; color: var(--text-muted); margin: 4px 0 0 0;"
                ></p>


                <label>
                    DIČ
                </label>

                <input
                    type="text"
                    id="edit-customer-dic"
                    name="dic"
                    value="{{ customer.dic or '' }}"
                >


                <label>
                    IČ DPH
                </label>

                <input
                    type="text"
                    id="edit-customer-ic_dph"
                    name="ic_dph"
                    value="{{ customer.ic_dph or '' }}"
                    placeholder="napr. SK1234567890"
                >


                <label>
                    Poznámka
                </label>


                <textarea
                    name="note"
                    rows="5"
                >{{ customer.note or '' }}</textarea>


                <div class="form-buttons">


                    <a
                        href="/customers/{{ customer.id }}"
                        class="cancel-button edit-cancel-link"
                    >
                        Zrušiť
                    </a>


                    <button
                        type="submit"
                        class="save-button"
                    >
                        Uložiť zmeny
                    </button>


                </div>


            </form>


        </div>


    </section>


</main>


<script>

/* =====================================
   VYHĽADANIE PODĽA IČO (auto-doplnenie)
   ===================================== */

async function lookupCustomerIco(prefix) {

    const icoInput = document.getElementById(prefix + "-customer-ico");
    const statusEl = document.getElementById(prefix + "-customer-ico-status");

    const ico = icoInput.value.trim();

    if (!ico) {

        statusEl.textContent = "Najprv zadaj IČO.";
        statusEl.style.color = "var(--danger, #c0392b)";
        return;

    }

    statusEl.textContent = "Hľadám...";
    statusEl.style.color = "var(--text-muted)";

    try {

        const response = await fetch(`/customers/lookup-ico/${encodeURIComponent(ico)}`);

        if (!response.ok) {

            statusEl.textContent = "Nenašlo sa - vyplň údaje ručne.";
            statusEl.style.color = "var(--danger, #c0392b)";
            return;

        }

        const data = await response.json();

        const nameField = document.getElementById(prefix + "-customer-name");
        const addressField = document.getElementById(prefix + "-customer-address");
        const dicField = document.getElementById(prefix + "-customer-dic");
        const icDphField = document.getElementById(prefix + "-customer-ic_dph");

        if (nameField && data.name) nameField.value = data.name;
        if (addressField && data.address) addressField.value = data.address;
        if (dicField && data.dic) dicField.value = data.dic;
        if (icDphField) icDphField.value = data.ic_dph || "";

        statusEl.textContent = "Nájdené a doplnené - skontroluj údaje.";
        statusEl.style.color = "var(--success, #2e7d32)";

    } catch (error) {

        statusEl.textContent = "Vyhľadávanie zlyhalo - vyplň údaje ručne.";
        statusEl.style.color = "var(--danger, #c0392b)";

    }

}


/* =====================================
   TÉMA
   ===================================== */


function applyTheme(theme) {

    document.documentElement.setAttribute(
        "data-theme",
        theme
    );


    const button =
        document.getElementById("themeButton");


    if (theme === "dark") {

        button.textContent = "☀️";

    } else {

        button.textContent = "🌙";

    }

}


function toggleTheme() {

    const currentTheme =
        document.documentElement.getAttribute(
            "data-theme"
        );


    const newTheme =
        currentTheme === "dark"
            ? "light"
            : "dark";


    localStorage.setItem(
        "digitalnyZositTheme",
        newTheme
    );


    applyTheme(newTheme);

}


const savedTheme =
    localStorage.getItem(
        "digitalnyZositTheme"
    );


if (savedTheme === "dark") {

    applyTheme("dark");

} else {

    applyTheme("light");

}

</script>


</body>

</html>
