<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Upraviť {{ customer.name }} - Digitálny zošit
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <div class="logo">
        <img src="/static/logo-icon.png" alt="" class="logo-icon"> Digitálny zošit
    </div>


    <div class="topbar-actions">

        <button
            type="button"
            class="theme-button"
            id="themeButton"
            data-action="toggle-theme"
            title="Prepnúť tému"
        >
            🌙
        </button>


        <a
            href="/customers/{{ customer.id }}"
            class="back-button"
        >
            ← Späť
        </a>

    </div>

</header>


<main class="container">


    <section class="edit-customer-page">


        <div class="page-header">

            <h1>
                Upraviť zákazníka
            </h1>

            <p>
                Zmeňte údaje zákazníka.
            </p>

        </div>


        <div class="edit-customer-card">


            <form
                action="/customers/{{ customer.id }}/edit"
                method="post"
            >
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">


                <label>
                    Meno *
                </label>


                <input
                    type="text"
                    id="edit-customer-name"
                    name="name"
                    value="{{ customer.name }}"
                    required
                >


                <label>
                    Telefón
                </label>


                <input
                    type="text"
                    name="phone"
                    value="{{ customer.phone or '' }}"
                >


                <label>
                    Email
                </label>


                <input
                    type="email"
                    name="email"
                    value="{{ customer.email or '' }}"
                >


                <label>
                    Adresa (ulica a číslo)
                </label>


                <input
                    type="text"
                    id="edit-customer-address"
                    name="address"
                    value="{{ customer.address or '' }}"
                >


                <div style="display: flex; gap: 8px;">

                    <div style="flex: 1;">

                        <label>
                            Mesto
                        </label>

                        <input
                            type="text"
                            id="edit-customer-city"
                            name="city"
                            value="{{ customer.city or '' }}"
                        >

                    </div>

                    <div style="flex: 1;">

                        <label>
                            PSČ
                        </label>

                        <input
                            type="text"
                            id="edit-customer-zip_code"
                            name="zip_code"
                            value="{{ customer.zip_code or '' }}"
                        >

                    </div>

                    <div style="flex: 1;">

                        <label>
                            Krajina <span style="font-weight: 400; color: var(--text-muted);">(ISO kód)</span>
                        </label>

                        <input
                            type="text"
                            id="edit-customer-country_code"
                            name="country_code"
                            value="{{ customer.country_code or 'SK' }}"
                            maxlength="2"
                            style="text-transform: uppercase;"
                        >

                    </div>

                </div>


                <label>
                    IČO <span style="font-weight: 400; color: var(--text-muted);">(pre firmy/živnostníkov)</span>
                </label>

                <div style="display: flex; gap: 8px;">

                    <input
                        type="text"
                        id="edit-customer-ico"
                        name="ico"
                        value="{{ customer.ico or '' }}"
                        style="flex: 1;"
                    >

                    <button
                        type="button"
                        class="cancel-button"
                        data-action="lookup-customer-ico" data-arg="edit"
                    >
                        Nájsť
                    </button>

                </div>

                <p
                    id="edit-customer-ico-status"
                    style="font-size: 0.85em; color: var(--text-muted); margin: 4px 0 0 0;"
                ></p>


                <label>
                    DIČ
                </label>

                <input
                    type="text"
                    id="edit-customer-dic"
                    name="dic"
                    value="{{ customer.dic or '' }}"
                >


                <label>
                    IČ DPH
                </label>

                <input
                    type="text"
                    id="edit-customer-ic_dph"
                    name="ic_dph"
                    value="{{ customer.ic_dph or '' }}"
                    placeholder="napr. SK1234567890"
                >


                <label>
                    Peppol schéma ID <span style="font-weight: 400; color: var(--text-muted);">(nepovinné)</span>
                </label>

                <input
                    type="text"
                    id="edit-customer-peppol_scheme_id"
                    name="peppol_scheme_id"
                    value="{{ customer.peppol_scheme_id or '' }}"
                    placeholder="napr. 9950 pre slovenskú firmu"
                    maxlength="4"
                >

                <label>
                    Peppol Endpoint ID <span style="font-weight: 400; color: var(--text-muted);">(hodnota adresy v tejto schéme)</span>
                </label>

                <input
                    type="text"
                    id="edit-customer-peppol_endpoint_id"
                    name="peppol_endpoint_id"
                    value="{{ customer.peppol_endpoint_id or '' }}"
                    placeholder="napr. SK2020123456"
                >

                <p style="font-size: 13px; color: var(--text-muted); margin-top: -8px;">
                    Oba kódy ti potvrdí Peppol poskytovateľ zákazníka - pri schéme 9950 (SK:VAT) je Endpoint ID zákazníkovo IČ DPH, nie IČO. Musia sa vyplniť spolu. Zatiaľ môžeš nechať obe prázdne.
                </p>



                <label>
                    Poznámka
                </label>


                <textarea
                    name="note"
                    rows="5"
                >{{ customer.note or '' }}</textarea>


                <div class="form-buttons">


                    <a
                        href="/customers/{{ customer.id }}"
                        class="cancel-button edit-cancel-link"
                    >
                        Zrušiť
                    </a>


                    <button
                        type="submit"
                        class="save-button"
                    >
                        Uložiť zmeny
                    </button>


                </div>


            </form>


        </div>


    </section>


</main>


<script src="{{ url_for('static', path='js/app.js') }}"></script>
<script src="{{ url_for('static', path='js/pages/edit_customer.js') }}"></script>


</body>

</html>
