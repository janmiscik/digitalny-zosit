<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Zabudnuté heslo - Digitálny zošit
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <div class="logo">
        <img src="/static/logo-icon.png" alt="" class="logo-icon"> Digitálny zošit
    </div>


    <div class="topbar-actions">

        <button
            type="button"
            class="theme-button"
            id="themeButton"
            onclick="toggleTheme()"
            title="Prepnúť tému"
        >
            🌙
        </button>

    </div>

</header>


<main class="container">

    <section class="edit-customer-page">

        <div class="page-header">
            <h1>Zabudnuté heslo</h1>
        </div>

        <div class="edit-customer-card">

            {% if message %}
                <div class="backup-notice backup-notice-ok">{{ message }}</div>
            {% endif %}

            {% if error %}
                <p style="color: var(--danger); margin-bottom: 16px;">{{ error }}</p>
            {% endif %}

            <p>Zadaj používateľské meno. Ak má konto nastavený e-mail, pošleme naň odkaz na zmenu hesla.</p>

            <form action="/forgot-password" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

                <label>Používateľské meno</label>
                <input type="text" name="username" required autofocus>

                <div class="form-buttons">
                    <button type="submit" class="save-button">Poslať odkaz</button>
                </div>
            </form>

            <p style="margin-top: 16px; font-size: 14px;"><a href="/login">Späť na prihlásenie</a></p>
        </div>

    </section>

</main>


<script>

/* =====================================
   TÉMA
   ===================================== */


function applyTheme(theme) {

    document.documentElement.setAttribute(
        "data-theme",
        theme
    );


    const button =
        document.getElementById("themeButton");


    if (theme === "dark") {

        button.textContent = "☀️";

    } else {

        button.textContent = "🌙";

    }

}


function toggleTheme() {

    const currentTheme =
        document.documentElement.getAttribute(
            "data-theme"
        );


    const newTheme =
        currentTheme === "dark"
            ? "light"
            : "dark";


    localStorage.setItem(
        "digitalnyZositTheme",
        newTheme
    );


    applyTheme(newTheme);

}


const savedTheme =
    localStorage.getItem(
        "digitalnyZositTheme"
    );


if (savedTheme === "dark") {

    applyTheme("dark");

} else {

    applyTheme("light");

}

</script>


</body>

</html>
