<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nové heslo - Digitálny zošit
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <div class="logo">
        <img src="/static/logo-icon.png" alt="" class="logo-icon"> Digitálny zošit
    </div>


    <div class="topbar-actions">

        <button
            type="button"
            class="theme-button"
            id="themeButton"
            data-action="toggle-theme"
            title="Prepnúť tému"
        >
            🌙
        </button>

    </div>

</header>


<main class="container">

    <section class="edit-customer-page">

        <div class="page-header">
            <h1>Nové heslo</h1>
        </div>

        <div class="edit-customer-card">

            {% if error %}
                <p style="color: var(--danger); margin-bottom: 16px;">{{ error }}</p>
            {% endif %}

            {% if valid %}
            <form action="/reset-password/{{ token }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

                <label>Nové heslo (aspoň 8 znakov)</label>
                <input type="password" name="new_password" autocomplete="new-password" minlength="8" required autofocus>

                <label>Nové heslo znova</label>
                <input type="password" name="new_password_confirm" autocomplete="new-password" minlength="8" required>

                <div class="form-buttons">
                    <button type="submit" class="save-button">Nastaviť heslo</button>
                </div>
            </form>
            {% else %}
                <p><a href="/forgot-password">Vyžiadať nový odkaz</a></p>
            {% endif %}

            <p style="margin-top: 16px; font-size: 14px;"><a href="/login">Späť na prihlásenie</a></p>
        </div>

    </section>

</main>


<script src="{{ url_for('static', path='js/app.js') }}"></script>


</body>

</html>
