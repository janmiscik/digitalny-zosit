<!DOCTYPE html>
<html lang="sk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chyba - Digitálny zošit</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >

</head>


<body>


<header class="topbar">

    <div class="logo">
        <img src="/static/logo-icon.png" alt="" class="logo-icon"> Digitálny zošit
    </div>

    <div class="topbar-actions">

        <button
            type="button"
            class="theme-button"
            id="themeButton"
            data-action="toggle-theme"
            title="Prepnúť tému"
        >
            🌙
        </button>

    </div>

</header>


<main class="container">


    <section class="edit-customer-page">


        <div class="page-header">

            <h1>
                {% if status_code == 404 %}
                    Nenájdené
                {% else %}
                    Niečo sa nepodarilo
                {% endif %}
            </h1>

            <p>
                {{ detail }}
            </p>

        </div>


        <div class="edit-customer-card" style="text-align: center; padding: 40px 30px;">

            <div style="font-size: 40px; margin-bottom: 16px;">
                {% if status_code == 404 %}
                    🔍
                {% else %}
                    ⚠️
                {% endif %}
            </div>

            <p style="color: var(--text-secondary); margin-bottom: 24px;">
                {% if status_code == 404 %}
                    Skús sa vrátiť späť.
                {% else %}
                    Skús sa vrátiť späť a formulár vyplniť znova.
                {% endif %}
            </p>

            <a
                href="{{ back_url }}"
                class="save-button"
                style="text-decoration: none; display: inline-block;"
            >
                ← Späť
            </a>

        </div>


    </section>


</main>


<script src="{{ url_for('static', path='js/app.js') }}"></script>


</body>

</html>
