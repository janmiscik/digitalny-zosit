# Alembic konfigurácia pre MASTER databázu kont (accounts.db) -
# oddelená od alembic.ini, ktorý spravuje business dáta appky vo
# vnútri jednotlivých kont (viď accounts_db.py pre vysvetlenie, prečo
# sú to dve úplne samostatné databázy).

[alembic]
script_location = %(here)s/alembic_accounts

prepend_sys_path = .

version_path_separator = os

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
